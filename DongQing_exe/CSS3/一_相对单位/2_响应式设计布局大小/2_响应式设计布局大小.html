<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive Font Size</title>
    <style>
        :root {
            font-size: 0.75em;
        }
        @media (min-width: 800px) {
            :root {
                font-size: 0.875em;
            }
        }
        @media (min-width: 1200px) {
            :root {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <h1>Responsive Font Size Example</h1>
    <p>This text will have a responsive font size based on the screen width.</p>
</body>
</html>
