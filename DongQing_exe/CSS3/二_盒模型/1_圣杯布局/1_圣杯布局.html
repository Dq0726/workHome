<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>现代圣杯布局</title>
<style>
/* ---------- 设计令牌（CSS 变量） ---------- */
:root {
  /* 颜色 */
  --clr-bg: #f5f7fa;
  --clr-main: #ffffff;
  --clr-accent: #0066ff;
  --clr-text: #222;
  /* 间距 */
  --gap: 1rem;
  --header-h: 4rem;
  --footer-h: 3rem;
  /* 字体 */
  --fs-base: clamp(1rem, 1vw + 0.5rem, 1.125rem);
}

/* 暗色模式 */
@media (prefers-color-scheme: dark) {
  :root {
    --clr-bg: #121212;
    --clr-main: #1e1e1e;
    --clr-accent: #4d8fff;
    --clr-text: #eee;
  }
}

/* ---------- 通用重置 ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, sans-serif;
  font-size: var(--fs-base);
  line-height: 1.5;
  color: var(--clr-text);
  background: var(--clr-bg);
  min-height: 100vh;
  display: grid;
  grid-template-rows: var(--header-h) 1fr var(--footer-h);
  gap: var(--gap);
}

/* ---------- 头部 / 底部 ---------- */
header,
footer {
  background: var(--clr-accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
}

/* ---------- 中间三栏 ---------- */
main {
  display: grid;
  gap: var(--gap);
  /* 移动端：单列 */
  grid-template-columns: 1fr;
  /* ≥768px：圣杯三栏 */
  grid-template-areas:
    "left center right";
  grid-template-columns: 1fr 2fr 1fr;
}

@media (max-width: 48rem) {
  main {
    grid-template-columns: 1fr;
    grid-template-areas:
      "left"
      "center"
      "right";
  }
}

aside.left  { grid-area: left; }
section     { grid-area: center; }
aside.right { grid-area: right; }

/* ---------- 卡片样式 ---------- */
.card {
  background: var(--clr-main);
  border-radius: 0.5rem;
  padding: var(--gap);
  box-shadow: 0 2px 6px rgb(0 0 0 / 0.08);
}

/* ---------- 响应式字体 ---------- */
h1 { font-size: clamp(1.5rem, 2vw + 1rem, 2.25rem); }
h2 { font-size: clamp(1.25rem, 1.5vw + 0.75rem, 1.75rem); }
</style>
</head>

<body>
  <header>
    <h1>现代圣杯布局</h1>
  </header>

  <main>
    <aside class="left card">
      <h2>左侧栏</h2>
      <p>使用相对单位与 Grid 区域命名。</p>
    </aside>

    <section class="card">
      <h2>主内容区</h2>
      <p>中间栏自适应，支持暗色模式。</p>
    </section>

    <aside class="right card">
      <h2>右侧栏</h2>
      <p>Flex 与 Grid 混合，代码更简洁。</p>
    </aside>
  </main>

  <footer>
    © 2025 CSS Grid 圣杯布局示例
  </footer>
</body>
</html>
