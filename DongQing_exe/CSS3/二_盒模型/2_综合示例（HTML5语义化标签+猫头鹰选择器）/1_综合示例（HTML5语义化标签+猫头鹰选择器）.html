<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Franklin Running Club</title>
  <style>
    :root {
      box-sizing: border-box;
    }

    *,
    ::before,
    ::after {
      box-sizing: inherit;
      padding: 0;
      margin: 0;
    }

    body {
      background: #eee;
      margin: 0 1em;
    }

    body *+* {
      margin-top: 1em;
    }

    header {
      margin-top: 0.5em;
      background: #3788f3;
      border-radius: .3em;
      color: #fff;
    }


    main {
      display: flex;
    }

    section {
      width: 70%;
      padding: 1em 1.5em;
      background: #fff;
      padding: 1em 0;


    }

    aside {
      width: 30%;
      margin-left: 1em;
      margin-top: 0;
      padding: 1.5em;
      background-color: #fff;
      border-radius: .5em;
    }

    .button-link {
      text-align: center;
      display: block;
      color: #fff;
      background: #3788f3;
      border-radius: 0.3em;
      padding: 0.5em 0;
    }

    .sponsor-link {
      display: block;
      border-radius: 0.3em;
      padding: .5em;
      text-align: center;
      color: #3788f3;
      display: block;

    }

    footer {
      margin-top: 1em;
      background: #fff;
      padding: .5em;
      text-align: center;
      color: #3788f3;
    }
  </style>
</head>

<body>
  <header>
    <h1>Franklin Running Club</h1>
  </header>
  <main class="container">
    <section class="main">
      <h2>Come join us!</h2>
      <p>
        The Franklin Running club meets at 6:00pm every Thursday at the town
        square. Runs are three to five miles, at your own pace.
      </p>
    </section>
    <aside class="sidebar">
      <a href="#" class="button-link"> Follow us on Twitter </a>
      <a href="#" class="button-link"> Like us on Facebook </a>
      <a href="#" class="sponsor-link"> become a sponsor </a>
    </aside>
  </main>
  <footer class="footer">
    <p>&copy; Franklin Running Club 2020</p>
  </footer>
</body>

</html>
