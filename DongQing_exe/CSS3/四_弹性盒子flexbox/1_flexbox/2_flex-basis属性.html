<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 超过 100% 演示</title>
    <style>
        .container {
            display: flex;
            width: 100%;
            border: 2px solid #333;
            margin-bottom: 20px;
        }

        .item {
            background-color: lightblue;
            border: 1px solid blue;
            padding: 10px;
            text-align: center;
        }

        .example1 .item1 { flex-basis: 20%; }
        .example1 .item2 { flex-basis: 20%; }
        .example1 .item3 { flex-basis: 20%; }
        .example1 .item4 { flex-basis: 40%; } /* 总计: 100% */

        .example2 .item1 { flex-basis: 30%; }
        .example2 .item2 { flex-basis: 30%; }
        .example2 .item3 { flex-basis: 30%; }
        .example2 .item4 { flex-basis: 30%; } /* 总计: 120% */

        .example3 .item1 { flex-basis: 40%; }
        .example3 .item2 { flex-basis: 40%; }
        .example3 .item3 { flex-basis: 40%; }
        .example3 .item4 { flex-basis: 40%; } /* 总计: 160% */

        h3 {
            color: #333;
        }
    </style>
</head>
<body>
    <h3>示例 1: flex-basis 总和 = 100%</h3>
    <div class="container example1">
        <div class="item item1">20%</div>
        <div class="item item2">20%</div>
        <div class="item item3">20%</div>
        <div class="item item4">40%</div>
    </div>

    <h3>示例 2: flex-basis 总和 = 120%</h3>
    <div class="container example2">
        <div class="item item1">30%</div>
        <div class="item item2">30%</div>
        <div class="item item3">30%</div>
        <div class="item item4">30%</div>
    </div>

    <h3>示例 3: flex-basis 总和 = 160%</h3>
    <div class="container example3">
        <div class="item item1">40%</div>
        <div class="item item2">40%</div>
        <div class="item item3">40%</div>
        <div class="item item4">40%</div>
    </div>

    <p>可以看到，即使 flex-basis 总和超过 100%，所有元素仍然在一行内显示，
       只是会按比例缩小以适应容器宽度。</p>
</body>
</html>
