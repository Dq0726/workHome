<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Session Storage Form Demo</title>
</head>

<body>
	<form action="#" id="userForm">
		<label for="username">Username:</label>
		<input type="text" id="username" name="username">
		<label for="password">Password:</label>
		<input type="password" id="password" name="password">
		<button type="submit">Submit</button>
	</form>
	<script>
		const userForm = document.getElementById('userForm');
		userForm.addEventListener('submit', () => {
			const username = document.getElementById('username').value;
			const password = document.getElementById('password').value;
			const userData = {
				username: username,
				password: password
			};
			sessionStorage.setItem('userData', JSON.stringify(userData));
		})

		document.addEventListener('DOMContentLoaded', () => {
			const userDataStr = sessionStorage.getItem('userData');
			const userData = userDataStr ? JSON.parse(userDataStr) : null;

			// 使用三元表达式设置表单值
			document.getElementById('username').value = userData && userData.username ? userData.username : 'xzx';
			document.getElementById('password').value = userData && userData.password ? userData.password : '770880';
		});
	</script>
</body>

</html>
